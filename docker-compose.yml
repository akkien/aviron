services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: aviron
      POSTGRES_PASSWORD: aviron
      POSTGRES_DB: aviron
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviron"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server-a:
    build:
      context: ./backend
    image: aviron-backend:local
    environment:
      DATABASE_URL: postgres://aviron:aviron@postgres:5432/aviron?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-dev-jwt-secret-change-me
      INSTANCE_ID: server-a:8080
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  server-b:
    build:
      context: ./backend
    image: aviron-backend:local
    environment:
      DATABASE_URL: postgres://aviron:aviron@postgres:5432/aviron?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-dev-jwt-secret-change-me
      INSTANCE_ID: server-b:8080
      PORT: "8080"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  race-router:
    build:
      context: ./backend
    image: aviron-backend:local
    command: ["/app/race-router"]
    environment:
      RACE_SERVICE_INSTANCES: server-a:8080,server-b:8080
      RACE_ROUTER_LISTEN_ADDR: :8080
      REDIS_URL: redis://redis:6379/0
    ports:
      - "9090:8080"
    depends_on:
      - server-a
      - server-b

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aviron.local
      PGADMIN_DEFAULT_PASSWORD: admin
      # Skips pgAdmin's own login screen — fine for a local-only dev tool,
      # matching this project's already-low-security local Postgres
      # credentials (aviron/aviron).
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-registers the "Aviron (local)" server connection so it shows up
      # in the tree on first load — pgAdmin still prompts for the Postgres
      # password once (aviron/aviron) since servers.json can't embed it
      # without a mounted pgpass file; check "Save Password" to skip that
      # prompt on future logins.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres

volumes:
  pgdata:
  pgadmin_data:
