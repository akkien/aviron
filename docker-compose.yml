services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: aviron
      POSTGRES_PASSWORD: aviron
      POSTGRES_DB: aviron
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviron"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is the internal, container-to-container listener (Docker
      # DNS service name, matching this project's server-a/server-b
      # convention); PLAINTEXT_HOST is the host-mapped listener for direct
      # access from the machine running docker compose (e.g. kcat,
      # kafka-console-consumer, this service's own healthcheck).
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # A fixed cluster ID, generated once via kafka-storage.sh random-uuid
      # — any valid value works for a single-node local dev broker, it just
      # has to be present and stable across restarts.
      CLUSTER_ID: rXESr6zLSEaqcR4ArgMiVA
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  nats:
    # nats:latest is a distroless-style image with nothing in it but the
    # nats-server binary itself — no shell, no wget, nothing `docker compose
    # exec` or a CMD-exec healthcheck can run. Confirmed the hard way
    # (multi-instance-dev-setup.md's own first live run): the healthcheck
    # below silently never passed, and `docker compose exec -T nats sh`
    # itself fails with "executable file not found in $PATH". nats:2-alpine
    # is the same nats-server, just on a base image with a real userland,
    # so the healthcheck below can actually execute.
    image: nats:2-alpine
    # -m 8222 turns on the monitoring HTTP endpoint solely so this
    # healthcheck has something to poll — no other service reads it.
    # JetStream is intentionally not enabled: room-message-bus.md accepts
    # at-most-once delivery, and this project runs NATS Core only.
    command: ["-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  server-a:
    build:
      context: ./backend
    image: aviron-backend:local
    environment:
      DATABASE_URL: postgres://aviron:aviron@postgres:5432/aviron?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_SECRET: local-dev-jwt-secret-change-me
      INSTANCE_ID: server-a:8080
      PORT: "8080"
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  server-b:
    build:
      context: ./backend
    image: aviron-backend:local
    environment:
      DATABASE_URL: postgres://aviron:aviron@postgres:5432/aviron?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_SECRET: local-dev-jwt-secret-change-me
      INSTANCE_ID: server-b:8080
      PORT: "8080"
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  ws-gateway:
    build:
      context: ./backend
    image: aviron-backend:local
    command: ["/app/ws-gateway"]
    environment:
      RACE_SERVICE_INSTANCES: server-a:8080,server-b:8080
      WS_GATEWAY_LISTEN_ADDR: :8080
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_SECRET: local-dev-jwt-secret-change-me
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "9090:8080"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      server-a:
        condition: service_started
      server-b:
        condition: service_started
    # Real healthcheck, unlike the replaced race-router (which never
    # exposed one at all) — ws-gateway.md closes that gap since a real load
    # balancer in front of this pool needs an actual health signal.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  consumer:
    build:
      context: ./backend
    image: aviron-backend:local
    command: ["/app/consumer"]
    environment:
      DATABASE_URL: postgres://aviron:aviron@postgres:5432/aviron?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      CONSUMER_LISTEN_ADDR: :8091
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Not a hard dependency for correctness (a Kafka consumer group can
      # start before any producer exists), but server-a/server-b are what
      # create workout.sample/race.finished's topics in practice (Producer's
      # AllowAutoTopicCreation) — starting after them avoids a cold
      # consumer group racing topic auto-creation on first boot.
      server-a:
        condition: service_started
      server-b:
        condition: service_started
    # No healthcheck of its own — a Kafka consumer group has no HTTP
    # surface to poll.

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aviron.local
      PGADMIN_DEFAULT_PASSWORD: admin
      # Skips pgAdmin's own login screen — fine for a local-only dev tool,
      # matching this project's already-low-security local Postgres
      # credentials (aviron/aviron).
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-registers the "Aviron (local)" server connection so it shows up
      # in the tree on first load — pgAdmin still prompts for the Postgres
      # password once (aviron/aviron) since servers.json can't embed it
      # without a mounted pgpass file; check "Save Password" to skip that
      # prompt on future logins.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres

volumes:
  pgdata:
  pgadmin_data:
