basePath: /
definitions:
  internal_auth.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  internal_auth.loginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  internal_auth.registerRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
    type: object
  internal_auth.registerResponse:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
    type: object
  internal_leaderboard.LeaderboardMeResponse:
    properties:
      avg_wpm:
        type: number
      races_joined:
        type: integer
      races_won:
        type: integer
    type: object
  internal_race.createRaceRequest:
    properties:
      distance_meters:
        type: integer
      name:
        type: string
    type: object
  internal_race.createRaceResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      distance_meters:
        type: integer
      id:
        type: string
      name:
        type: string
      session_token:
        description: |-
          SessionToken is the creator's own WS handshake credential — the
          creator is auto-added as a participant by CreateRace, same as JoinRace.
        type: string
      status:
        type: string
    type: object
  internal_race.getRaceTextResponse:
    properties:
      prompt_text:
        type: string
    type: object
  internal_race.joinRaceResponse:
    properties:
      race_id:
        type: string
      session_token:
        type: string
    type: object
  internal_race.listOpenRacesResponse:
    properties:
      races:
        items:
          $ref: '#/definitions/internal_race.openRaceResponse'
        type: array
    type: object
  internal_race.openRaceResponse:
    properties:
      created_at:
        type: string
      distance_meters:
        type: integer
      host_display_name:
        type: string
      id:
        type: string
      max_players:
        type: integer
      name:
        type: string
      player_count:
        type: integer
    type: object
  internal_race.participantResponse:
    properties:
      avg_pace_watt:
        type: number
      display_name:
        type: string
      finish_rank:
        description: |-
          FinishRank/FinishTimeMs are nil until the race finishes
          (race-detail-cold-visit.md) — same nullable shape as the live
          race_finished WebSocket message's RaceResultJSON, so a cold REST
          visit and a live connection can render results the same way.
        type: integer
      finish_time_ms:
        type: integer
      joined_at:
        type: string
      user_id:
        type: string
    type: object
  internal_race.raceStatusResponse:
    properties:
      created_by:
        type: string
      distance_meters:
        type: integer
      id:
        type: string
      name:
        type: string
      participants:
        items:
          $ref: '#/definitions/internal_race.participantResponse'
        type: array
      pending_expires_at:
        description: |-
          PendingExpiresAt is nil once the race is no longer pending (active,
          finished, or cancelled) — there's no expiry concept once a race has
          actually started (room-lifecycle/pending-expiry.md).
        type: string
      status:
        type: string
    type: object
  internal_race.startRaceResponse:
    properties:
      id:
        type: string
      prompt_text:
        type: string
      started_at:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: Real-time multiplayer fitness backend (Aviron-inspired). See context/project-overview.md
    for the full design.
  title: Aviron Backend API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Exchanges email and password for a JWT
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.loginResponse'
        "401":
          description: 'error: invalid_credentials'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with an email, password, and display
        name
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_auth.registerResponse'
        "400":
          description: field-keyed validation errors
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 'error: email_taken'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /healthz:
    get:
      description: Pings the database connection pool and reports service health
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: 'status: db_unreachable'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /leaderboard/me:
    get:
      description: Returns the caller's own races-joined/races-won/avg-WPM stats.
        An account with no finished races yet gets all-zero stats, not a 404.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leaderboard.LeaderboardMeResponse'
        "401":
          description: 'error: unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get my leaderboard stats
      tags:
      - leaderboard
  /races:
    get:
      description: Returns pending, joinable races the caller hasn't already created
        or joined
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_race.listOpenRacesResponse'
        "401":
          description: 'error: unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List open races
      tags:
      - races
    post:
      consumes:
      - application/json
      description: Creates a new typing race with a name and target word count
      parameters:
      - description: Create race payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_race.createRaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_race.createRaceResponse'
        "400":
          description: field-keyed validation errors
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 'error: unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a race
      tags:
      - races
  /races/{id}:
    get:
      description: Returns a race's current status and participant list
      parameters:
      - description: Race ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_race.raceStatusResponse'
        "400":
          description: 'error: invalid_race_id'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: race_not_found'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get race status
      tags:
      - races
  /races/{id}/join:
    post:
      description: Joins an existing race as a participant, returning a per-race session
        token
      parameters:
      - description: Race ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_race.joinRaceResponse'
        "400":
          description: 'error: invalid_race_id'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: race_not_found'
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 'error: already_joined | race_not_pending | race_full'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Join a race
      tags:
      - races
  /races/{id}/start:
    post:
      description: 'Creator starts the race: generates the shared prompt text and
        flips status to active'
      parameters:
      - description: Race ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_race.startRaceResponse'
        "400":
          description: 'error: invalid_race_id'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: forbidden'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: race_not_found'
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 'error: race_not_pending'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start a race
      tags:
      - races
  /races/{id}/text:
    get:
      description: Fetches the race's already-generated prompt text
      parameters:
      - description: Race ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_race.getRaceTextResponse'
        "400":
          description: 'error: invalid_race_id'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: race_not_found'
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 'error: prompt_not_ready'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get race prompt text
      tags:
      - races
swagger: "2.0"
