# alerting/telegram-relay.md — dedicated Secret, not two extra keys on
# aviron-secret: rotating/viewing the Telegram bot token never touches
# JWT_SECRET/POSTGRES_PASSWORD, and only telegram-relay's own Deployment
# ever mounts this one.
apiVersion: v1
kind: Secret
metadata:
  name: telegram-secret
  namespace: aviron
type: Opaque
stringData:
  # Real values come from @BotFather (bot token) and one manual getUpdates
  # call (chat ID) — a one-time manual step outside this codebase, same
  # category as this project's other manual kind/kubectl/Helm setup steps.
  # Never commit real values here.
  TELEGRAM_BOT_TOKEN: "changeme-bot-token"
  TELEGRAM_CHAT_ID: "changeme-chat-id"
