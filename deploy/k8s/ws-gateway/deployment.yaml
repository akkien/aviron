apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
  namespace: aviron
spec:
  # Matches docker-compose.yml's own two-gateway topology, and the exact
  # topology load/multi-instance-check.md already proved by hand.
  replicas: 2
  selector:
    matchLabels:
      app: ws-gateway
  template:
    metadata:
      labels:
        app: ws-gateway
    spec:
      # cmd/ws-gateway's own shutdownTimeout (25s) + connFlushWindow
      # (500ms) is slightly larger than race-service's internal budget —
      # 30s still leaves a healthy margin, confirmed against the actual
      # constants in cmd/ws-gateway/run.go, not assumed.
      terminationGracePeriodSeconds: 30
      # dynamic-backend-discovery.md — read access to this namespace's
      # own EndpointSlice objects, nothing else. See rbac.yaml.
      serviceAccountName: ws-gateway
      containers:
        - name: ws-gateway
          image: aviron-backend:local
          imagePullPolicy: IfNotPresent
          # The shared image's own CMD defaults to /app/server —
          # override it to run the gateway binary instead, same as
          # docker-compose.yml's own `command: ["/app/ws-gateway"]`.
          command: ["/app/ws-gateway"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: WS_GATEWAY_LISTEN_ADDR
              value: ":8080"
            # Superseded as the actual routing source by
            # dynamic-backend-discovery.md's EndpointSlice-based
            # discovery, which wins automatically in-cluster (decided by
            # whether rest.InClusterConfig succeeds, not this value) —
            # kept only because Config.LoadConfig still requires a
            # non-empty RACE_SERVICE_INSTANCES to start at all. No longer
            # the "most likely to silently drift" risk phase-5-plan.md
            # once flagged for this value, since nothing in-cluster
            # actually reads it anymore.
            - name: RACE_SERVICE_INSTANCES
              value: "race-service-0.race-service.aviron.svc.cluster.local:8080,race-service-1.race-service.aviron.svc.cluster.local:8080"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: aviron-config
                  key: REDIS_URL
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: aviron-config
                  key: NATS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aviron-secret
                  key: JWT_SECRET
            - name: CORS_ALLOWED_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: aviron-config
                  key: CORS_ALLOWED_ORIGIN
          # Readiness: internal/wsgateway/healthz.go's existing Redis +
          # NATS check.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness: the new, dependency-free /livez (graceful-shutdown.md)
          # — a transient Redis/NATS blip must not make kubelet restart an
          # otherwise-healthy gateway pod.
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          # Halved from 100m/64Mi requests, 500m/128Mi limits.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
