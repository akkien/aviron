apiVersion: v1
kind: Service
metadata:
  name: race-service
  namespace: aviron
spec:
  # Headless — gives each pod a stable, predictable DNS name
  # (race-service-0.race-service.aviron.svc.cluster.local, race-service-1...)
  # instead of a single load-balanced ClusterIP. This is the whole point
  # of this spec: k8s-ws-gateway-deploy.md's RACE_SERVICE_INSTANCES needs
  # to address each backend individually, not round-robin through one IP.
  clusterIP: None
  selector:
    app: race-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http
