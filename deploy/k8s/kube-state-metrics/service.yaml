apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: aviron
spec:
  # Headless — Prometheus reaches it via pod discovery (the annotation on
  # the Deployment's pod template), not this Service's DNS name; kept only
  # so kube-state-metrics has a stable Service identity like every other
  # component here.
  clusterIP: None
  selector:
    app: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
    - name: telemetry
      port: 8081
      targetPort: telemetry
