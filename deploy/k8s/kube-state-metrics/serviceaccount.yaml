# dashboards/grafana-deploy.md — a real, additional prerequisite for the
# HPA panel specifically (kube_horizontalpodautoscaler_* metrics come from
# here, not from metrics/prometheus-deploy.md's own app-level scrape
# targets). Deployed into the aviron namespace, not kube-system, matching
# this project's convention that everything project-related lives in one
# namespace — the RBAC below is still cluster-scoped regardless of which
# namespace the pod itself runs in, since it reports on Deployments/HPAs/
# Pods across the whole cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: aviron
