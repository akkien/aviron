apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: aviron
spec:
  # Plain ClusterIP — verification is via kubectl port-forward
  # (metrics/prometheus-deploy.md's own Verification section), no Ingress;
  # nothing outside this namespace needs to reach Prometheus's UI/API.
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: http
