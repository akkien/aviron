apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aviron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # trace-alert-rules.md — the one deliberate exception to this
            # project's pull-only metrics stance (phase-6-plan.md
            # Decisions #5), scoped narrowly to Tempo's metrics-generator
            # remote-write path, not a general policy change.
            - --web.enable-remote-write-receiver
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            # alerting/alert-rules.md — a second ConfigMap volume, not a
            # second key mounted into the same directory as prometheus.yml:
            # keeps the rules file independently editable/reloadable from
            # the scrape config, referenced by prometheus.yml's own
            # rule_files entry.
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          # Modest — a single-node Prometheus scraping ~9 targets every
          # 15s (the chart's own default scrape_interval) on a laptop kind
          # cluster, not a real production retention target. See Storage
          # below for why there's no PVC to size around either.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        # emptyDir, no PersistentVolumeClaim — TSDB data doesn't survive a
        # pod restart, the same "this is a laptop kind cluster, not a real
        # retention target" stance already taken for Kafka
        # (persistence.enabled: false) and NATS (no JetStream).
        - name: data
          emptyDir: {}
