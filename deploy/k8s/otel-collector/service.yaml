apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: aviron
spec:
  # Plain ClusterIP — the one address every binary's
  # OTEL_EXPORTER_OTLP_ENDPOINT points at once tracing/instrumentation.md
  # lands, never reached from outside the cluster.
  selector:
    app: otel-collector
  ports:
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
