apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aviron
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aviron-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aviron-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: aviron-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aviron"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "aviron"]
            initialDelaySeconds: 10
            periodSeconds: 10
          # Halved from 100m/256Mi requests, 500m/512Mi limits.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
  # volumeClaimTemplates, not a separately hand-written PVC — a StatefulSet
  # provisions and binds one PVC per replica from this template
  # automatically (named pgdata-postgres-0), and kind's default
  # `standard` StorageClass (rancher.io/local-path) supports dynamic
  # provisioning, so no static PersistentVolume needs to exist first.
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
