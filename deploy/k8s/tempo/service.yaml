apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: aviron
spec:
  # Plain ClusterIP. Port 3200 is Tempo's own query API (what Grafana's
  # Tempo data source will read from, dashboards/grafana-deploy.md —
  # queried directly, never through the Collector); port 4317 is the
  # Collector's OTLP export target.
  selector:
    app: tempo
  ports:
    - port: 3200
      targetPort: 3200
      name: http
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
