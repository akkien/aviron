# tracing/otel-collector-tempo-deploy.md — single-binary "monolithic
# mode", local filesystem backend for both WAL and block storage. Tempo's
# own Helm chart supports far more (S3/GCS, distributed microservices
# mode), none of which this laptop kind cluster needs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: aviron
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        # Tempo can receive OTLP directly (any binary could in principle
        # point straight at this) — the Collector is the architecture's
        # single fan-out point instead, so every binary only needs to
        # know one address (otel-collector-tempo-deploy.md's "Tempo").
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    # trace-alert-rules.md — derives Prometheus-shaped RED metrics from
    # every span Tempo already receives (span-metrics processor) and
    # remote-writes them into Prometheus, so trace data can be alerted on
    # through the existing Alertmanager pipeline instead of a separate
    # trace-querying engine.
    overrides:
      defaults:
        metrics_generator:
          processors: [span-metrics]
    metrics_generator:
      storage:
        path: /var/tempo/generator-wal
        # remote_write is a storage-level field in Tempo's own config
        # schema, not a sibling of storage/registry.
        remote_write:
          - url: http://prometheus.aviron.svc.cluster.local:9090/api/v1/write
            send_exemplars: true
      registry:
        external_labels:
          cluster: aviron-kind
