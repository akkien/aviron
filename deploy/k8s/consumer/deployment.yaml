apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: aviron
spec:
  # No horizontal-scaling story needed here — a Kafka consumer group
  # already handles partition rebalancing if this were ever scaled up
  # (internal/consumer's two GroupIDs), and nothing about this phase
  # requires exercising that.
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
      # Scraped by Prometheus's kubernetes_sd_configs role: pod discovery
      # (metrics/prometheus-deploy.md), now that metrics/metrics-parity.md
      # gave this binary a real /metrics endpoint.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
        prometheus.io/path: "/metrics"
    spec:
      # No http.Server.Shutdown involved here (cmd/consumer never opens
      # one) — just the fetch loops draining on ctx cancellation
      # (graceful-shutdown.md), which return promptly. Tighter than
      # race-service's/ws-gateway's 30s.
      terminationGracePeriodSeconds: 15
      containers:
        - name: consumer
          image: aviron-backend:local
          imagePullPolicy: IfNotPresent
          # The shared image's own CMD defaults to /app/server — override
          # to run the consumer binary instead, same as
          # docker-compose.yml's own `command: ["/app/consumer"]`.
          command: ["/app/consumer"]
          ports:
            - containerPort: 8091
              name: http
          env:
            # Explicit, matching this project's convention elsewhere
            # (ws-gateway sets WS_GATEWAY_LISTEN_ADDR even though it also
            # matches its own default) — metrics/metrics-parity.md gave
            # this binary an HTTP server purely for /metrics+pprof, this
            # spec is what makes it reachable in-cluster via the new
            # consumer Service.
            - name: CONSUMER_LISTEN_ADDR
              value: ":8091"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aviron-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aviron-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.aviron.svc.cluster.local:5432/aviron?sslmode=disable"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: aviron-config
                  key: KAFKA_BROKERS
          # Halved from 50m/64Mi requests, 250m/128Mi limits.
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 125m
              memory: 64Mi
          # No readinessProbe/livenessProbe: this binary's only HTTP
          # surface is /metrics+/debug/pprof/* (metrics/metrics-parity.md)
          # — a Prometheus scrape failing simply shows the target down,
          # it's not user-facing traffic a readiness gate needs to protect.
          # An exec probe (e.g. pgrep) was considered but rejected as
          # inventing a signal this binary has no other reason to expose —
          # restartPolicy: Always's own crash-detection (the Deployment
          # default) is a sufficient substitute for a local kind cluster.
