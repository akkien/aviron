# Bitnami Kafka chart values for this project's local kind cluster —
# see context/features/phase5/k8s-core-infra.md's "Kafka" section.
#
# Installed via:
#   helm install aviron-kafka bitnami/kafka --version 32.4.3 \
#     --namespace aviron -f deploy/k8s/kafka/values.yaml
#
# image.registry/repository overridden to bitnamilegacy: as of August 2025
# Broadcom moved most docker.io/bitnami/* tags behind a paid "Bitnami
# Secure Images" subscription and pruned the free ones — this chart
# version's own default (docker.io/bitnami/kafka:4.0.0-debian-12-r10)
# 404s on a real pull, confirmed directly against this cluster
# (ImagePullBackOff). bitnamilegacy is the community mirror of the old
# free images Bitnami/Broadcom itself set up as a stopgap; used
# deliberately here, not as an oversight, and worth revisiting if it ever
# stops being maintained.
image:
  registry: docker.io
  repository: bitnamilegacy/kafka

# KRaft mode is the only mode this chart version supports (Kafka 4.0
# dropped ZooKeeper entirely) — no zookeeper.enabled toggle needed.
# controllerOnly stays false (chart default): a single node acting as
# both broker and controller, matching docker-compose.yml's own
# KAFKA_PROCESS_ROLES: broker,controller single-process topology.
controller:
  replicaCount: 1
  persistence:
    # Matches docker-compose.yml's own kafka service, which mounts no
    # volume today — topics/messages not surviving a broker pod restart
    # is already this project's accepted local-dev stance, not a new
    # regression introduced by moving to Kubernetes.
    enabled: false
  # Real bug found live, not anticipated when this file was first
  # written: with no override, Kafka defaults to
  # offsets.topic.replication.factor=3 for its internal
  # __consumer_offsets topic — impossible to satisfy with a single
  # broker, so the topic never gets created and every consumer group
  # fetch fails with "Group Coordinator Not Available" forever, not just
  # during a slow startup. docker-compose.yml's own kafka service
  # already carries the equivalent fix
  # (KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1).
  #
  # overrideConfiguration, not the top-level config key: the top-level
  # config key REPLACES the chart's entire auto-generated configuration
  # wholesale (its own doc comment says as much — "this will override
  # the configuration based on values, please act carefully"), stripping
  # out the auto-generated KRaft bootstrap settings (process.roles,
  # node.id, controller.quorum.voters, ...) this single combined node
  # actually needs to start at all. Confirmed the hard way: a bare
  # top-level `config:` block with only these 3 keys crash-looped the
  # broker at the storage-format step on every attempt, fresh install
  # included. overrideConfiguration layers specific keys on top of the
  # chart's own generated config instead of replacing it outright.
  overrideConfiguration:
    offsets.topic.replication.factor: "1"
    transaction.state.log.replication.factor: "1"
    transaction.state.log.min.isr: "1"

# broker.replicaCount stays at the chart default (0) — no separate
# broker-only pool, single combined node above is the whole cluster.

# The chart defaults every listener to SASL_PLAINTEXT — this project's
# own Kafka client code (internal/kafka.Producer, internal/consumer,
# both plain segmentio/kafka-go with no SASL mechanism configured) has
# never done SASL, matching docker-compose.yml's own plain PLAINTEXT
# listener (KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ...:PLAINTEXT
# everywhere, no SASL at all). Overridden here deliberately, not an
# oversight — same "this is a local kind cluster, not a real deployment
# target" stance already taken for Postgres/JWT credentials in
# secret.yaml.
listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
