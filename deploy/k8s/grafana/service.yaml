apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: aviron
spec:
  # Plain ClusterIP — reached via kubectl port-forward for now, same as
  # Kibana/Prometheus; a future Ingress is explicitly out of scope here.
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      name: http
