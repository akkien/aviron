apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: aviron
spec:
  # Plain ClusterIP — Prometheus's own alerting.alertmanagers config
  # (prometheus/configmap.yaml) addresses it by this Service name; the UI
  # is reached via kubectl port-forward, same as every other observability
  # backend in this phase.
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
      name: http
