apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aviron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          # No PersistentVolume — redis-room-registry.md's ownership keys
          # and evicted-user set are both self-healing via TTL, so losing
          # in-memory state on a pod restart is an accepted, bounded-impact
          # event, not data loss the way losing Postgres would be.
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
