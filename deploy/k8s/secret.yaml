apiVersion: v1
kind: Secret
metadata:
  name: aviron-secret
  namespace: aviron
type: Opaque
stringData:
  # Same local-dev-only values docker-compose.yml already uses literally —
  # this is a local kind cluster, not a real deployment target.
  JWT_SECRET: "local-dev-jwt-secret-change-me"
  POSTGRES_USER: "aviron"
  POSTGRES_PASSWORD: "aviron"
  POSTGRES_DB: "aviron"
